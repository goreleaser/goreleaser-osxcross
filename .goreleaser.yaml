---
version: 2

builds:
  - skip: true

# NOTE: needs to be run with `--parallelism=1`, as goreleaser and
# goreleaser-pro depends on base.
dockers_v2:
  - id: osxcross
    images:
      - "goreleaser/goreleaser-osxcross"
      - "ghcr.io/goreleaser/goreleaser-osxcross"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      OSX_SDK: "{{ .Env.OSX_SDK }}"
      OSX_SDK_SUM: "{{ .Env.OSX_SDK_SUM }}"
      OSX_VERSION_MIN: "{{ .Env.OSX_VERSION_MIN }}"
      OSX_CROSS_COMMIT: "{{ .Env.OSX_CROSS_COMMIT }}"
      DEBIAN_FRONTEND: "{{ .Env.DEBIAN_FRONTEND }}"
    extra_files:
      - tars
      - patches
  - id: osxcross-musl
    images:
      - "goreleaser/goreleaser-osxcross"
      - "ghcr.io/goreleaser/goreleaser-osxcross"
    tags:
      - "{{ .Tag }}-musl"
      - "v{{ .Major }}.{{ .Minor }}-musl"
      - "latest-musl"
    dockerfile: musl.Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - tars
      - patches
    build_args:
      OSX_SDK: "{{ .Env.OSX_SDK }}"
      OSX_SDK_SUM: "{{ .Env.OSX_SDK_SUM }}"
      OSX_VERSION_MIN: "{{ .Env.OSX_VERSION_MIN }}"
      OSX_CROSS_COMMIT: "{{ .Env.OSX_CROSS_COMMIT }}"
docker_signs:
  - cmd: cosign
    output: true
    args:
      - "sign"
      - "${artifact}"
      - "--yes"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
